{% set name = "opentelemetry-proto" %}
{% set version = "1.43.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/open-telemetry/{{ name.split('-')[0] }}-python/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7fa3279ff22ee1322ab9e92290d4b0547e19ce164ff3ebbbeb3fcdaf96f0f2a4

build:
  number: 1
  script: {{ PYTHON }} -m pip install ./{{ name }} -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install ./{{ name }} -vv --no-deps --no-build-isolation --no-compile  # [win]
  skip: true  # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - protobuf >=5.0,<8.0

test:
  source_files:
    - {{ name }}/tests
  imports:
    - opentelemetry
    - opentelemetry.proto
    - opentelemetry.proto.collector
    - opentelemetry.proto.common
    - opentelemetry.proto.logs
    - opentelemetry.proto.metrics
    - opentelemetry.proto.profiles
    - opentelemetry.proto.resource
    - opentelemetry.proto.trace
  commands:
    - pip check
    - pytest -vv {{ name }}/tests
  requires:
    - pip
    - pytest >=7.4.4
    - colorama >=0.4.6
    - iniconfig >=2.0.0
    - packaging >=24.0

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-proto
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: OpenTelemetry Python / Proto
  description: |-
    OpenTelemetry, also known as OTel for short, is a vendor-neutral open-source
    Observability framework for instrumenting, generating, collecting, and exporting
    telemetry data such as traces, metrics, logs. As an industry-standard
    it is natively supported by a number of vendors.
  doc_url: https://opentelemetry-python.readthedocs.io
  dev_url: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - mariusvniekerk
